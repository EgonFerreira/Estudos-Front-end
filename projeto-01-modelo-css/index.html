<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exemplo de modelos de CSS </title>
    <link rel=" stylesheet" href="style.css"> <!-- link para arquivo Css externo chamado  "styles.css"
    que será usado para estilzar a pagina-->
    </head>

<body>
    <!-- "DIV" é a divisão principal para agrupar o conteudo da pagina com classe "container"
      para aplicar estilos especificos"-->
    <div class ="container">
        <!-- Cabeçalho de nivel 1, geralmente usado para titulo principal de uma pagina-->
         <h1> Modelo de Formatação CSS</h1>
         <!-- Paragrafo fe texto explicando-->
        <p> este é um exemplo para enteder como o CSS lido com layout  e a formatação dos elementos</p>
    <!-- Outra divisão com classe "BOX" para aplicar estilos CSS especificos-->
    
    
    <div class="box"> Caixa de Exemplo</div>       
</div>
 
<h1> Exemplos de Gradinte no Css</h1>
    <div class= "gradient-box linear">
        <h2>Gradient-box Linear </h2>
        <p> Exemplo é um exemplo  de gradiente linear </p>
    </div>
    
    <div class="gradient-box radial">
        <h2> Gradiente box Radial</h2>
        <p> Exemplo de gradiante box Radial</p>
    </div>

    
</body>
</html>
